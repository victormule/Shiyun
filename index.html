<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Shiyun</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; cursor: grab; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
      "GLTFLoader": "https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js",
      "OrbitControls": "https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // === SCÈNE ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // === CAMERA ===
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 10, 50);
    camera.lookAt(0, 0, 0);

    // === RENDERER ===
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // === CONTROLS (désactivés après animation) ===
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;

    // === LUMIÈRES ===
    const light = new THREE.DirectionalLight(0xffffff, 3.5);
    light.position.set(50, 40, 30);
    light.castShadow = true;
    light.shadow.mapSize.set(2048, 2048);
    light.shadow.camera.left = -50;
    light.shadow.camera.right = 50;
    light.shadow.camera.top = 50;
    light.shadow.camera.bottom = -50;
    light.shadow.camera.near = 1;
    light.shadow.camera.far = 100;
    scene.add(light);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // === MODÈLE 3D ===
    let model = null;
    const rotationSpeed = 0.5; // vitesse de rotation du modèle

    const loader = new GLTFLoader();
    loader.load('model/shiyun.glb', (gltf) => {
      model = gltf.scene;
      model.scale.set(5, 5, 5);
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(model);
    }, undefined, (error) => {
      console.error('Erreur de chargement du modèle :', error);
    });

    // === CERCLE D'IMAGES AUTOUR DU MODÈLE ===
    const imageGroup = new THREE.Group(); // groupe qui contiendra les images
    scene.add(imageGroup);

    const textureLoader = new THREE.TextureLoader();
    const imagePaths = [
      'image/wumu1.jpg',
      'image/wumu2.jpg',
      'image/wumu3.jpg',
      'image/wumu4.jpg',
      'image/wumu5.jpg',
      'image/wumu6.jpg'
    ];

    const radius = 35;     // distance du cercle par rapport au centre
    const height = 0;      // hauteur des images
    const imageWidth = 10; // taille des plans
    const imageHeight = 14;

    imagePaths.forEach((path, index) => {
      const texture = textureLoader.load(path);
      const geometry = new THREE.PlaneGeometry(imageWidth, imageHeight);
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(geometry, material);

      const angle = (index / imagePaths.length) * Math.PI * 2;
      plane.position.set(
        Math.cos(angle) * radius,
        height,
        Math.sin(angle) * radius
      );

      // Les images regardent vers le centre (là où est le modèle)
      plane.lookAt(new THREE.Vector3(0, height, 0));

      imageGroup.add(plane);
    });

    // === ANIMATION DE LA CAMÉRA ===
    const startPosition = new THREE.Vector3(100, 100, 70);
    const targetPosition = new THREE.Vector3(-5, 0, 5);
    let progress = 0;
    const speed = 0.008;
    let animationFinished = false;

    // === MOLETTE DE LA SOURIS ===
    window.addEventListener('wheel', (event) => {
      if (!animationFinished || !model) return;

      event.preventDefault();

      // facteur de base (tu peux l'augmenter si tu veux tout plus rapide)
      const baseFactor = event.deltaY * 0.005;

      // rotation du modèle
      model.rotation.y += baseFactor * rotationSpeed;

      // rotation du cercle d'images : 1,5x plus vite que le modèle
      imageGroup.rotation.y += baseFactor * rotationSpeed * 1;
    }, { passive: false });

    // === BOUCLE D'ANIMATION ===
    function animate() {
      requestAnimationFrame(animate);

      // Animation de la caméra
      if (progress < 1) {
        progress += speed;
        progress = Math.min(progress, 1);
        camera.position.lerpVectors(startPosition, targetPosition, progress);
        camera.lookAt(0, 0, 0);

        if (progress === 1) {
          animationFinished = true;
          controls.dispose();
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // === ADAPTATION À LA FENÊTRE ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
