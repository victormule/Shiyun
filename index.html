<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Shiyun</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; cursor: grab; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
      "GLTFLoader": "https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js",
      "OrbitControls": "https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // === CONFIGURATION DES IMAGES (VOS FICHIERS SPECIFIQUES) ===
    const imageFiles = [
      'wumu.png',
      'wumu1.png',
      'wumu2.png',
      'wumu3.png',
      'wumu4.png'
    ];
    const circleRadius = 28; // Rayon du cercle (ajusté pour 5 images)
    const imageSize = { width: 10, height: 7 }; // Taille des images (plus grande pour être visibles)
    const imageHeight = 1; // Hauteur légèrement au-dessus du sol

    // === SCÈNE ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // === CAMERA ===
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 10, 50);
    camera.lookAt(0, 0, 0);

    // === RENDERER ===
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // === CONTROLS ===
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;

    // === LUMIÈRES ===
    const light = new THREE.DirectionalLight(0xffffff, 3.5);
    light.position.set(50, 40, 30);
    light.castShadow = true;
    light.shadow.mapSize.set(2048, 2048);
    light.shadow.camera.left = -50;
    light.shadow.camera.right = 50;
    light.shadow.camera.top = 50;
    light.shadow.camera.bottom = -50;
    light.shadow.camera.near = 1;
    light.shadow.camera.far = 100;
    scene.add(light);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // === VARIABLES GLOBALES ===
    let model = null;
    const rotationSpeed = 0.6; // Vitesse de rotation optimisée
    const imagePlanes = [];

    // === CHARGEMENT DU MODÈLE GLB ===
    const loader = new GLTFLoader();
    loader.load('model/shiyun.glb', (gltf) => {
      model = gltf.scene;
      model.scale.set(5, 5, 5);
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(model);
      loadImagesInCircle(); // Charger images après modèle
    }, undefined, (error) => {
      console.error('Erreur de chargement du modèle :', error);
      loadImagesInCircle(); // Charger images même si modèle échoue
    });

    // === CHARGEMENT DES IMAGES EN CERCLE ===
    function loadImagesInCircle() {
      if (imageFiles.length === 0) {
        console.warn('Aucune image trouvée !');
        return;
      }

      const textureLoader = new THREE.TextureLoader();
      const angleStep = (Math.PI * 2) / imageFiles.length; // Angle uniforme pour 5 images

      imageFiles.forEach((file, index) => {
        // Calcul position sur le cercle
        const angle = index * angleStep;
        const x = Math.cos(angle) * circleRadius;
        const z = Math.sin(angle) * circleRadius;

        // Charger texture avec gestion des erreurs
        textureLoader.load(`image/${file}`, (texture) => {
          // Améliorer la qualité des images
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.needsUpdate = true;

          // Matériau avec transparence et double face
          const material = new THREE.MeshLambertMaterial({
            map: texture,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 1,
            depthWrite: false // Éviter les conflits de profondeur entre images
          });

          // Géométrie de plané
          const geometry = new THREE.PlaneGeometry(imageSize.width, imageSize.height);
          const plane = new THREE.Mesh(geometry, material);

          // Positionnement et orientation
          plane.position.set(x, imageHeight, z);
          plane.lookAt(0, imageHeight, 0); // Tourné vers le centre
          plane.receiveShadow = true;

          scene.add(plane);
          imagePlanes.push(plane);
        }, undefined, (error) => {
          console.error(`Erreur chargement image ${file} :`, error);
        });
      });
    }

    // === ANIMATION CAMÉRA ===
    const startPosition = new THREE.Vector3(100, 100, 70);
    const targetPosition = new THREE.Vector3(-5, 0, 5);
    let progress = 0;
    const speed = 0.008;
    let animationFinished = false;

    // === GESTION MOLETTE (ROTATION MODÈLE + IMAGES) ===
    window.addEventListener('wheel', (event) => {
      if (!animationFinished || !model) return;
      
      event.preventDefault();
      const rotationDelta = event.deltaY * 0.012 * rotationSpeed; // Vitesse réactive

      // Rotation modèle
      model.rotation.y += rotationDelta;

      // Rotation images en sens inverse pour rester en cercle
      imagePlanes.forEach(plane => {
        plane.rotation.y -= rotationDelta;
        plane.lookAt(0, imageHeight, 0); // Garder orientation vers centre
      });
    }, { passive: false });

    // === ANIMATION PRINCIPALE ===
    function animate() {
      requestAnimationFrame(animate);

      if (progress < 1) {
        progress += speed;
        progress = Math.min(progress, 1);
        camera.position.lerpVectors(startPosition, targetPosition, progress);
        camera.lookAt(0, 0, 0);
        
        if (progress === 1) {
          animationFinished = true;
          controls.dispose();
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // === ADAPTATION FENÊTRE ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
