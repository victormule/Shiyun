<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Shiyun</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; cursor: grab; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
      "GLTFLoader": "https://unpkg.com/three@0.155.0/examples/jsm/loaders/GLTFLoader.js",
      "OrbitControls": "https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // === CONFIGURATION DES IMAGES ===
    // Liste des images dans le dossier "image/" (ajoutez/supprimez selon vos fichiers)
    const imageFiles = [
      'wumu.png',
      'wumu1.png',
      'wumu2.png',
      'wumu3.png',
      // Ajoutez toutes vos images ici
    ];
    // Paramètres du cercle d'images
    const circleRadius = 25; // Rayon du cercle (distance du modèle)
    const imageSize = { width: 8, height: 6 }; // Taille des planés d'images
    const imageHeight = 0; // Hauteur des images sur l'axe Y (0 = même niveau que le modèle)

    // === SCÈNE ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // === CAMERA ===
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 10, 50);
    camera.lookAt(0, 0, 0);

    // === RENDERER ===
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // === CONTROLS ===
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enablePan = false;

    // === LUMIÈRES ===
    const light = new THREE.DirectionalLight(0xffffff, 3.5);
    light.position.set(50, 40, 30);
    light.castShadow = true;
    light.shadow.mapSize.set(2048, 2048);
    light.shadow.camera.left = -50;
    light.shadow.camera.right = 50;
    light.shadow.camera.top = 50;
    light.shadow.camera.bottom = -50;
    light.shadow.camera.near = 1;
    light.shadow.camera.far = 100;
    scene.add(light);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // === VARIABLES GLOBALES ===
    let model = null;
    const rotationSpeed = 0.5;
    const imagePlanes = []; // Stockage des planés d'images

    // === CHARGEMENT DU MODÈLE GLB ===
    const loader = new GLTFLoader();
    loader.load('model/shiyun.glb', (gltf) => {
      model = gltf.scene;
      model.scale.set(5, 5, 5);
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(model);

      // Charger les images APRES que le modèle soit chargé
      loadImagesInCircle();
    }, undefined, (error) => {
      console.error('Erreur de chargement du modèle :', error);
      // Charger les images même si le modèle échoue (pour tester)
      loadImagesInCircle();
    });

    // === FONCTION DE CHARGEMENT DES IMAGES EN CERCLE ===
    function loadImagesInCircle() {
      if (imageFiles.length === 0) {
        console.warn('Aucune image dans la liste imageFiles !');
        return;
      }

      const textureLoader = new THREE.TextureLoader();
      const angleStep = (Math.PI * 2) / imageFiles.length; // Angle entre chaque image

      imageFiles.forEach((file, index) => {
        // Calcul de la position sur le cercle
        const angle = index * angleStep;
        const x = Math.cos(angle) * circleRadius;
        const z = Math.sin(angle) * circleRadius;

        // Chargement de la texture de l'image
        textureLoader.load(`image/${file}`, (texture) => {
          // Création du matériau avec l'image
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            side: THREE.DoubleSide, // Afficher l'image des deux côtés
            transparent: true, // Gérer la transparence si besoin
            opacity: 1
          });

          // Création du plané (géométrie)
          const geometry = new THREE.PlaneGeometry(imageSize.width, imageSize.height);
          const plane = new THREE.Mesh(geometry, material);

          // Positionnement du plané sur le cercle
          plane.position.set(x, imageHeight, z);
          // Orienter le plané vers le centre (modèle)
          plane.lookAt(0, imageHeight, 0);
          // Ajouter un petit décalage en hauteur pour éviter le sol
          plane.position.y = imageHeight;

          // Ajouter à la scène et au tableau de suivi
          scene.add(plane);
          imagePlanes.push(plane);

          // Ajouter des ombres (optionnel)
          plane.castShadow = false;
          plane.receiveShadow = true;
        }, undefined, (error) => {
          console.error(`Erreur de chargement de l'image ${file} :`, error);
        });
      });
    }

    // === ANIMATION DE LA CAMÉRA ===
    const startPosition = new THREE.Vector3(100, 100, 70);
    const targetPosition = new THREE.Vector3(-5, 0, 5);
    let progress = 0;
    const speed = 0.008;
    let animationFinished = false;

    // === GESTION DE LA MOLETTE ===
    window.addEventListener('wheel', (event) => {
      if (!animationFinished || !model) return;
      
      event.preventDefault();
      const rotationDelta = event.deltaY * 0.01 * rotationSpeed;
      
      // Rotation du modèle
      model.rotation.y += rotationDelta;
      
      // Rotation des images en sens inverse pour rester autour du modèle
      // (ou supprimez cette partie si vous voulez que les images restent fixes)
      imagePlanes.forEach(plane => {
        plane.rotation.y -= rotationDelta;
        // Reorienter les images vers le centre
        plane.lookAt(0, imageHeight, 0);
      });
    }, { passive: false });

    // === ANIMATION PRINCIPALE ===
    function animate() {
      requestAnimationFrame(animate);

      if (progress < 1) {
        progress += speed;
        progress = Math.min(progress, 1);
        camera.position.lerpVectors(startPosition, targetPosition, progress);
        camera.lookAt(0, 0, 0);
        
        if (progress === 1) {
          animationFinished = true;
          controls.dispose();
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // === ADAPTATION À LA FENÊTRE ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
